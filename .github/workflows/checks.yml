name: Repository checks

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Repository checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Check documentation and accidental secret additions
        run: python3 scripts/check.py
      - name: Install encryption tool for recovery tests
        run: sudo apt-get update -qq && sudo apt-get install -y age
      - name: Exercise host helper failure paths and recovery encryption
        run: python3 -m unittest discover -s tests -v
      - name: Validate Compose with safe example settings
        run: |
          docker compose --env-file .env.example config --quiet
          docker compose --env-file .env.example -f compose.yaml -f infra/restore-isolated.yaml config --quiet
