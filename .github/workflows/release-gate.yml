name: Release gate

on:
  workflow_dispatch:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main
    tags:
      - "v0.1*"

permissions:
  contents: read

jobs:
  v0-1:
    name: v0.1 checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Show tool versions
        run: |
          python --version
          node --version
          docker compose version

      - name: Run release gate
        run: bash ops/release/check-local.sh
