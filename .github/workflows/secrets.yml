name: Deliver runtime secrets

on:
  workflow_dispatch:
    inputs:
      target:
        description: Prepared target (this does not install or migrate the VPN)
        type: choice
        options: [staging, production]
        required: true
      apply_bot:
        description: Apply Telegram settings through the running panel's native API
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: runtime-secrets-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  deliver:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: vpn-${{ inputs.target }}
    steps:
      - uses: actions/checkout@v5
      - name: Deliver over verified SSH without logging secret values
        env:
          MIRAGE_TARGET: ${{ inputs.target }}
          MIRAGE_APPLY_BOT: ${{ inputs.apply_bot }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_ID: ${{ secrets.TELEGRAM_ADMIN_ID }}
          DUCKDNS_TOKEN: ${{ secrets.DUCKDNS_TOKEN }}
        run: python3 infra/provision.py --send
