---
- name: Bootstrap Mirage VPS locally
  hosts: mirage_vps
  gather_facts: true

  pre_tasks:
    - name: Confirm that playbook runs from a root session
      ansible.builtin.assert:
        that:
          - ansible_user_id == "root"
        fail_msg: >-
          Run this first bootstrap from the temporary root session on the VPS.
          The playbook creates the non-root admin user after backups are in place.
      tags:
        - always

    - name: Confirm that bootstrap runs locally on the VPS
      ansible.builtin.assert:
        that:
          - ansible_connection == "local"
        fail_msg: >-
          This playbook is designed for the first bootstrap directly on the VPS.
          Use inventory/localhost.yml or change the playbook deliberately.
      tags:
        - always

  roles:
    - role: bootstrap_access
      tags:
        - bootstrap
        - access

    - role: base_security
      tags:
        - bootstrap
        - security

    - role: network_tuning
      tags:
        - bootstrap
        - network

    - role: dynamic_dns
      when: dynamic_dns_enabled | bool
      tags:
        - dns
        - dynamic-dns

    - role: ssh_hardening
      when: enable_ssh_hardening | bool
      tags:
        - hardening
        - ssh

    - role: marzban
      when: marzban_install_enabled | bool
      tags:
        - panel
        - marzban

    - role: xray_core
      when: xray_pin_enabled | bool
      tags:
        - core
        - xray

    - role: tls_certificate
      when: tls_certificate_enabled | bool
      tags:
        - certificate
        - tls

    - role: xray_inbounds
      when: xray_inbounds_enabled | bool
      tags:
        - inbounds
        - xray

    - role: caddy_subscription
      when: caddy_subscription_enabled | bool
      tags:
        - caddy
        - subscription
        - https

    - role: telegram_bot
      when: telegram_bot_enabled | bool
      tags:
        - telegram
        - telegram-bot
