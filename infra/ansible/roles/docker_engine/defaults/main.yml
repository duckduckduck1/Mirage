---
# Роль намеренно предназначена только для чистого Ubuntu 22.04 LTS. Она не
# обновляет и не заменяет уже существующую Docker-установку общего VPS.
docker_engine_install_enabled: false
docker_engine_supported_distribution: Ubuntu
docker_engine_supported_version: "22.04"
docker_engine_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin
docker_engine_keyring_dir: /etc/apt/keyrings
docker_engine_keyring_path: /etc/apt/keyrings/docker.asc
docker_engine_repository_file: /etc/apt/sources.list.d/docker.list
