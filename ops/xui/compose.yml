services:
  xui-ops:
    build:
      context: ../..
      dockerfile: ops/xui/Dockerfile
    image: mirage-xui-ops:local
    network_mode: host
    security_opt:
      - no-new-privileges:true
    env_file:
      - .env.local
    volumes:
      - .:/app/ops/xui:ro
      - ../../backups:/app/backups
