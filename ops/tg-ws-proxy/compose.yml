services:
  tg-ws-proxy:
    build:
      context: ../..
      dockerfile: ops/tg-ws-proxy/Dockerfile
      args:
        TG_WS_PROXY_VERSION: ${TG_WS_PROXY_VERSION:-v1.6.5}
    image: ${TG_WS_IMAGE:-mirage-tg-ws-proxy:local}
    container_name: mirage-tg-ws-proxy
    restart: unless-stopped
    env_file:
      - .env.local
    ports:
      - "${TG_WS_PUBLIC_PORT:-9443}:${TG_WS_LISTEN_PORT:-1443}/tcp"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
