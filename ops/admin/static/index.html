<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mirage Admin</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <h1>Mirage Admin</h1>
          <p id="summary">Локальная панель управления VPN</p>
        </div>
        <div class="status-pill" id="status-pill">нет связи</div>
      </header>

      <section class="auth-panel" aria-label="Доступ">
        <label for="token">Токен администратора</label>
        <div class="auth-row">
          <input id="token" type="password" autocomplete="off" placeholder="MIRAGE_ADMIN_TOKEN">
          <button id="connect" type="button">Подключиться</button>
        </div>
      </section>

      <section class="grid">
        <article class="panel">
          <div class="panel-head">
            <h2>Состояние</h2>
            <button id="refresh" type="button">Обновить</button>
          </div>
          <dl class="metrics" id="metrics"></dl>
          <div class="checks" id="checks"></div>
        </article>

        <article class="panel">
          <div class="panel-head">
            <h2>Профили</h2>
            <button id="create-profile" type="button">Создать</button>
          </div>
          <form id="profile-form" class="inline-form">
            <input id="profile-name" type="text" autocomplete="off" placeholder="profile-name">
            <input id="profile-comment" type="text" autocomplete="off" placeholder="Комментарий">
          </form>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Имя</th>
                  <th>Статус</th>
                  <th>Flow</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="profiles"></tbody>
            </table>
          </div>
        </article>

        <article class="panel wide">
          <div class="panel-head">
            <h2>Профиль подключения</h2>
            <div class="actions">
              <button id="copy-link" type="button">Копировать ссылку</button>
              <button id="copy-fields" type="button">Копировать поля</button>
            </div>
          </div>
          <div id="profile-detail" class="profile-detail empty">Выбери профиль из списка</div>
        </article>

        <article class="panel">
          <div class="panel-head">
            <h2>Бэкапы</h2>
            <div class="actions">
              <button id="prune-backups" type="button">Очистить старые</button>
              <button id="create-backup" type="button">Создать</button>
            </div>
          </div>
          <div class="backup-list" id="backups"></div>
        </article>

        <article class="panel">
          <div class="panel-head">
            <h2>Telegram alerts</h2>
            <button id="test-alert" type="button">Тест</button>
          </div>
          <dl class="metrics compact" id="alert-metrics"></dl>
          <div class="checks" id="alerts"></div>
        </article>

        <article class="panel">
          <div class="panel-head">
            <h2>Доступ</h2>
            <div class="actions">
              <button id="open-panel" type="button">Открыть 3x-ui</button>
              <button id="load-access" type="button">Показать</button>
            </div>
          </div>
          <pre id="access" class="code-box">Нет данных</pre>
        </article>
      </section>
    </main>
    <div id="toast" role="status" aria-live="polite"></div>
    <script src="/app.js"></script>
  </body>
</html>
