services:
  mirage-admin:
    build:
      context: ../..
      dockerfile: ops/admin/Dockerfile
    image: mirage-admin:local
    container_name: mirage-admin
    # Host networking so the app can reach 3x-ui on 127.0.0.1:<panel> and bind the
    # admin API on 127.0.0.1 only (never exposed externally). See docs/architecture.md.
    network_mode: host
    user: "${MIRAGE_ADMIN_UID:-10001}:${MIRAGE_ADMIN_GID:-10001}"
    security_opt:
      - no-new-privileges:true
    mem_limit: 200m
    pids_limit: 256
    restart: unless-stopped
    env_file:
      - ../xui/.env.local
      - .env.local
    environment:
      MIRAGE_ADMIN_BACKUP_DIR: /data/backups
      MIRAGE_ADMIN_RESTORE_REQUEST_DIR: /data/restore-requests
      MIRAGE_ADMIN_RESTORE_STATUS_DIR: /data/restore-status
    volumes:
      - ${MIRAGE_ADMIN_BACKUP_DIR_HOST:-../../backups}:/data/backups
      - ${MIRAGE_ADMIN_RESTORE_REQUEST_DIR_HOST:-../../.local/restore-requests}:/data/restore-requests
      - ${MIRAGE_ADMIN_RESTORE_STATUS_DIR_HOST:-../../.local/restore-status}:/data/restore-status:ro

  mirage-alerts:
    build:
      context: ../..
      dockerfile: ops/admin/Dockerfile
    image: mirage-admin:local
    container_name: mirage-alerts
    network_mode: host
    user: "${MIRAGE_ADMIN_UID:-10001}:${MIRAGE_ADMIN_GID:-10001}"
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    pids_limit: 128
    restart: unless-stopped
    command: ["monitor"]
    env_file:
      - ../xui/.env.local
      - .env.local
    environment:
      MIRAGE_ADMIN_BACKUP_DIR: /data/backups
      MIRAGE_ALERT_STATE_FILE: /data/alerts/state.json
    volumes:
      - ${MIRAGE_ADMIN_BACKUP_DIR_HOST:-../../backups}:/data/backups
      - ${MIRAGE_ALERT_STATE_DIR_HOST:-../../.local/admin-alerts}:/data/alerts
