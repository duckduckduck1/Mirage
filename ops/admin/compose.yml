services:
  mirage-admin:
    build:
      context: ../..
      dockerfile: ops/admin/Dockerfile
    image: mirage-admin:local
    container_name: mirage-admin
    network_mode: host
    user: "${MIRAGE_ADMIN_UID:-10001}:${MIRAGE_ADMIN_GID:-10001}"
    restart: unless-stopped
    env_file:
      - ../xui/.env.local
      - .env.local
    environment:
      MIRAGE_ADMIN_BACKUP_DIR: /data/backups
    volumes:
      - ${MIRAGE_ADMIN_BACKUP_DIR_HOST:-../../backups}:/data/backups

  mirage-alerts:
    build:
      context: ../..
      dockerfile: ops/admin/Dockerfile
    image: mirage-admin:local
    container_name: mirage-alerts
    network_mode: host
    user: "${MIRAGE_ADMIN_UID:-10001}:${MIRAGE_ADMIN_GID:-10001}"
    restart: unless-stopped
    command: ["monitor"]
    env_file:
      - ../xui/.env.local
      - .env.local
    environment:
      MIRAGE_ADMIN_BACKUP_DIR: /data/backups
      MIRAGE_ALERT_STATE_FILE: /data/alerts/state.json
    volumes:
      - ${MIRAGE_ADMIN_BACKUP_DIR_HOST:-../../backups}:/data/backups
      - ${MIRAGE_ALERT_STATE_DIR_HOST:-../../.local/admin-alerts}:/data/alerts
